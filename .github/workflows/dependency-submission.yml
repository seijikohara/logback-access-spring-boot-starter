name: Dependency Submission

on:
  push:
    branches: [main]

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required by the Dependency Submission API to submit the dependency graph.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

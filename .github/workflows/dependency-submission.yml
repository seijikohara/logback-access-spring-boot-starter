name: Dependency Submission

on:
  push:
    branches: [main]

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required by the Dependency Submission API to submit the dependency graph.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

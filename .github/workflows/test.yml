name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Validate each PR commit once via pull_request, and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: Build and test
        run: ./gradlew clean build -PtestJavaVersion=${{ matrix.java-version }}

      - name: Generate KDoc
        run: ./gradlew dokkaGenerateHtml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/
          retention-days: 7
